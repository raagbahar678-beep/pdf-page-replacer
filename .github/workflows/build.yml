name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: gradle assembleDebug --stacktrace 2>&1 | tee build-log.txt

      - name: Rename APK
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk "PDF Page Replacer.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PDF Page Replacer
          path: PDF Page Replacer.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
